services:
  prover-backend:
    build:
      context: .
      target: prover-backend
    image: prover-backend
    env_file:
     - .env_prover
    volumes:
      - type: bind
        source: .
        target: /bitvmx-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:80"
    networks:
      - bitvmx-net

  verifier-backend:
    build:
      context: .
      target: verifier-backend
    image: verifier-backend
    env_file:
     - .env_verifier
    volumes:
      - type: bind
        source: .
        target: /bitvmx-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    networks:
      - bitvmx-net

  bitcoin-regtest-node:
#    build:
#      context: .
#      target: kylemanna/bitcoind
    image: kylemanna/bitcoind
    ports:
      - "8443:8443"
    networks:
      - bitvmx-net
    volumes:
      - type: bind
        source: regtestbitcoin.conf
        target: /bitcoin/.bitcoin/bitcoin.conf

  format:
    build:
      context: .
      target: bitvmx-base
    image: bitvmx-base
    volumes:
      - type: bind
        source: .
        target: /bitvmx-backend
    networks:
      - bitvmx-net

networks:
  bitvmx-net: