[package]
name = "btcfi-contracts"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bitcoin = "0.30"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
bitcoin-script-riscv = { path = "../BitVMX-CPU/bitcoin-script-riscv" }

# Oracle VM common types
[dependencies.oracle-vm-common]
path = "../../crates/common"
optional = true

[features]
default = []
oracle-integration = ["oracle-vm-common"]

[[example]]
name = "option_product_registration_with_proof"
path = "examples/option_product_registration_with_proof.rs"

[[example]]
name = "option_registration_bitvmx_proof"
path = "examples/option_registration_bitvmx_proof.rs"

[[example]]
name = "complete_option_registration_flow"
path = "examples/complete_option_registration_flow.rs"