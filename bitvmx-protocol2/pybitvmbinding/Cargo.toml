[package]
name    = "pybitvmbinding"
version = "0.1.0"
edition = "2021"

[lib]
name       = "pybitvmbinding"
crate-type = ["cdylib"]

# ───────── 일반 의존성 ─────────
[dependencies]
pyo3  = "0.20.0"
bitvm = { git = "https://github.com/BitVM/BitVM" }

# ★ BitVM 과 같은 커밋으로 명시
bitcoin-script = { git = "https://github.com/BitVM/rust-bitcoin-script" }

bitcoin = "0.32.7"

strum          = "0.26"
strum_macros   = "0.26"
hex            = "0.4.3"
serde          = { version = "1.0.197", features = ["derive"] }
num-bigint     = "0.4.4"
num-traits     = "0.2.18"
sha2           = "0.10.8"
tokio          = { version = "1.37.0", features = ["full"] }
serde_json     = "1.0.116"
lazy_static    = "1.4.0"

# ── Arkworks crates.io 0.5.x ──
ark-std               = "0.5.0"
ark-groth16           = "0.5.0"
ark-crypto-primitives = "0.5.0"
ark-r1cs-std          = "0.5.0"

# ── 체인웨이 algebra 포크 ──
ark-bn254 = { git = "https://github.com/chainwayxyz/algebra", branch = "new-ate-loop", features = ["curve"], default-features = false }
ark-ff    = { git = "https://github.com/chainwayxyz/algebra", branch = "new-ate-loop" }
ark-ec    = { git = "https://github.com/chainwayxyz/algebra", branch = "new-ate-loop" }

[dev-dependencies]
rand_chacha = "0.3.1"
rand        = "0.8.5"
num-bigint  = { version = "0.4.4", features = ["rand"] }
ark-std     = "0.5.0"

# ───────── patch 섹션 (그대로) ─────────
[patch.crates-io]
ark-bn254     = { git = "https://github.com/chainwayxyz/algebra", branch = "new-ate-loop" }
ark-ff        = { git = "https://github.com/chainwayxyz/algebra", branch = "new-ate-loop" }
ark-ec        = { git = "https://github.com/chainwayxyz/algebra", branch = "new-ate-loop" }
ark-poly      = { git = "https://github.com/chainwayxyz/algebra", branch = "new-ate-loop" }
ark-serialize = { git = "https://github.com/chainwayxyz/algebra", branch = "new-ate-loop" }
ark-std       = { git = "https://github.com/97woo/arkworks-rs-std", branch = "sync-feature" }
