services:
  prover-backend:
    build:
      context: ..
      dockerfile: bitvmx/Dockerfile
      target: prover-backend
    image: prover-backend
    env_file:
     - .env_prover
     - .env_common
    volumes:
      - type: bind
        source: .
        target: /bitvmx-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:80"
    networks:
      - bitvmx-net

  verifier-backend:
    build:
      context: ..
      dockerfile: bitvmx/Dockerfile
      target: verifier-backend
    image: verifier-backend
    env_file:
     - .env_verifier
     - .env_common
    volumes:
      - type: bind
        source: .
        target: /bitvmx-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    networks:
      - bitvmx-net


  format:
    build:
      context: ..
      dockerfile: bitvmx/Dockerfile
      target: bitvmx-base
    image: bitvmx-base
    volumes:
      - type: bind
        source: .
        target: /bitvmx-backend
    entrypoint: sh -c "black --config .black . && ruff check --fix"

  flake8:
    image: bitvmx-base
    volumes:
      - type: bind
        source: ./
        target: /bitvmx-backend
        read_only: true
    entrypoint: flake8

  black:
    image: bitvmx-base
    volumes:
      - type: bind
        source: ./
        target: /bitvmx-backend
        read_only: true
    entrypoint: black --config .black --check --diff .

networks:
  bitvmx-net: