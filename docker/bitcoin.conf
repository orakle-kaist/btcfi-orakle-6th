# Bitcoin Regtest Configuration for Development

# Global settings
server=1
printtoconsole=1
fallbackfee=0.00001

# RPC Configuration
rpcuser=bitcoinrpc
rpcpassword=rpcpassword
rpcallowip=0.0.0.0/0

[regtest]
# Regtest specific settings
port=18444
rpcport=18443
bind=0.0.0.0:18444
rpcbind=0.0.0.0:18443
debug=rpc
debug=net
maxconnections=50
timeout=5000