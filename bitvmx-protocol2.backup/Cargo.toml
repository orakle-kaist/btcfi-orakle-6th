[workspace]
members = [
    ".",
    "BitVMX-CPU/bitcoin-script-riscv",
    "BitVMX-CPU/emulator",
]

[package]
name = "bitvmx_protocol2"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoin = { version = "0.31", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
bincode = "1.3"
pyo3 = { version = "0.22", features = ["auto-initialize"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }

# Local dependencies
# btcfi-contracts = { path = "contracts" }

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }

[[bin]]
name = "bitvmx-settlement"
path = "main.py"

[lib]
name = "bitvmx_protocol2"
path = "bitvmx_protocol_library/__init__.py"